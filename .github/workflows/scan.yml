name: Housing Availability Scanner

on:
  # Run every 2 hours, around the clock.
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
  # Also validate scanner changes immediately when pushed to main.
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: housing-availability-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run official property scanner
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python scanner.py

      - name: Run secondary marketplace lead scanner
        run: python external_scanner.py

      - name: Commit and push results
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "Housing Scanner Bot"
          git add availability_results.json scan_history.json external_leads.json
          git diff --staged --quiet || git commit -m "chore: housing availability scan $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
